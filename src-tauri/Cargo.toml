[package]
name = "novaterm"
version = "0.1.0"
description = "NovaTerm: terminal liviana para trabajar con agentes de IA"
edition = "2021"

[lib]
name = "novaterm_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri-plugin-opener = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
