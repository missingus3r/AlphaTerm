[package]
name = "alphaterm"
version = "0.7.0"
description = "AlphaTerm: terminal liviana para trabajar con agentes de IA"
edition = "2021"

[lib]
name = "alphaterm_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
ruzstd = "0.9.1"
ignore = "0.4.34"
notify = "8.2.2"
tiny_http = "0.12.0"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "system-proxy"] }
vt100 = "0.18.1"
similar = "3.2.1"
png = "0.18"
pdf-extract = "0.12.1"

# Linux: the built-in browser is a WebKitGTK webview (the same versions Tauri/wry already use).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1"
cairo-rs = "0.18"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Development (`npx tauri dev`, `cargo test`): without this, target\debug grew to 28 GB, almost all of
# it debug info from the dependencies. Our own code keeps only line numbers (enough for backtraces);
# dependencies, build scripts and macros, nothing.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
